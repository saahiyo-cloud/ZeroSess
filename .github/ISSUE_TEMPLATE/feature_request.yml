name: ✨ Feature Request
description: Suggest an idea or new feature for ZeroSess
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make ZeroSess even better? Let us know!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: A clear and concise description of what feature or enhancement you would like to see.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Problem & Use Case
      description: Explain why this feature is needed and how it benefits users.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
